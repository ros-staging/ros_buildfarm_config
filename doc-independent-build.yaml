%YAML 1.1
# ROS buildfarm doc-build file
---
documentation_type: make_target
doc_repositories:
  catkin_pkg:
    url: https://github.com/ros-infrastructure/catkin_pkg.git
    branch: use-rtd-theme
install_apt_packages:
- python3-catkin-pkg-modules
- python3-dateutil
- python3-wstool
- python3-yaml
- python3-sphinx
- python3-sphinx-rtd-theme
install_pip_packages:
- catkin-sphinx
- xmlschema
jenkins_job_priority: 80
jenkins_job_timeout: 30
notifications:
  emails:
  - ros-buildfarm@googlegroups.com
  - tfoote+buildfarm@osrfoundation.org
targets:
  ubuntu:
    pretend:
      amd64:
type: doc-build
upload_credential_id: jenkins-agent
upload_host: repo.test.ros2.org
upload_root: /var/repos/docs
upload_user: jenkins-agent
version: 2
