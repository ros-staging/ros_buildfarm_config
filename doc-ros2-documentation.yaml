%YAML 1.1
# ROS buildfarm ROS 2 documentation build file
---
documentation_type: docker_build
doc_repositories:
  ros2_doc:
    url: https://github.com/ros2/ros2_documentation.git
    branch: rolling
jenkins_job_priority: 80
jenkins_job_timeout: 30
notifications:
  emails:
  - steven+openrobotics@nuclearsandwich.com
type: doc-build
upload_credential_id: jenkins-agent
upload_host: repo.test.ros2.org
upload_root: /var/repos/en
upload_user: jenkins-agent
version: 2
