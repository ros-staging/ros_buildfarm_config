%YAML 1.1
# ROS buildfarm ci-build file
---
build_environment_variables:
  ROS_PYTHON_VERSION: '3'
build_tool: colcon
build_tool_args: '--cmake-args -DLLVM_CONFIG_EXECUTABLE=/usr/bin/llvm-config-9 --no-warn-unused-cli'
build_tool_test_args: '--skip-packages ikos'
jenkins_job_label: ci-agent
jenkins_job_priority: 50
jenkins_job_schedule: H H * * 0
jenkins_job_timeout: 300
jenkins_job_weight: 4
package_selection_args: ''
install_packages:
- gcc
- g++
- cmake
- libgmp-dev
- libboost-dev
- libboost-filesystem-dev
- libboost-thread-dev
- libboost-test-dev
- python3
- python3-pygments
- libsqlite3-dev
- libtbb-dev
- libz-dev
- libedit-dev
- llvm-9
- llvm-9-dev
- llvm-9-tools
- clang-9
repos_files:
- https://github.com/nuclearsandwich/ros2/raw/spaceros/ikos.repos
targets:
  ubuntu:
    focal:
      amd64:
type: ci-build
version: 1

